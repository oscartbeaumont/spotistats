name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `ready_for_review` lets a human trigger checks for a bot-authored draft
    # pull request, and `closed` cleans up the preview deployment.
    types: [opened, synchronize, reopened, ready_for_review, closed]

concurrency:
  # Key pull request runs by PR number. When a pull request closes, `github.ref`
  # resolves to the base branch, so keying on the ref made the cleanup run share
  # the production group and cancel the deploy triggered by the merge.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded pull request runs (including a preview that is still
  # running when its pull request closes), but never interrupt a production
  # deploy, so deploys on `main` stay in order.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Start from no permissions and grant the minimum each job needs.
permissions: {}

env:
  CF_SEND_TELEMETRY: "false"

jobs:
  build:
    # A closed pull request only needs the cleanup job.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fail on anti-slop diagnostics before spending time on tests and builds.
      - run: pnpm lint

      - run: pnpm test

      # Type check, then build the client and the Worker bundle.
      - run: pnpm build

      # Validate the exact Build Output that the deploy jobs publish.
      - run: pnpm exec cf deploy --prebuilt --mode production --dry-run

      # Production deploys and preview deploys are built from this output.
      # Forked and Dependabot pull requests never deploy, so skip their upload.
      - name: Upload build output
        if: >-
          github.event_name == 'push' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-build
          path: .cloudflare/output/v1
          include-hidden-files: true
          # Allow re-running a failed workflow with the same artifact name.
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # Deploying existing Build Output only needs the `cf` binary and the
      # configuration, so skip the install scripts.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-build
          path: .cloudflare/output/v1

      - name: Deploy to Cloudflare Workers
        id: deploy
        run: pnpm exec cf deploy --prebuilt --mode production --message "Deploy ${GITHUB_SHA:0:12}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test
        run: |
          set -euo pipefail
          for url in "https://spotistats.otbeaumont.me/"; do
            curl --fail --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 3 \
              --output /dev/null "$url"
            echo "OK $url"
          done

      # `cf deploy` switches traffic before the smoke test runs, so a failed
      # probe leaves the previous version live only after restoring it. `cf`
      # has no rollback command yet, so create a deployment for the previous
      # version instead.
      - name: Roll back if the smoke test fails
        if: failure() && steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # The deployment that failed the probe is the newest one, so the
          # version before it is the one that was live beforehand.
          previous="$(pnpm exec cf workers deployments list --worker spotistats --per-page 2 | jq -er '[.deployments[].versions[0].version_id][1]')"
          pnpm exec cf workers deployments create \
            --worker spotistats \
            --strategy percentage \
            --versions "[{\"version_id\":\"$previous\",\"percentage\":100}]"

  preview-deploy:
    needs: build
    # Secrets are unavailable to forked pull requests, and Dependabot runs get a
    # read-only token, so those never deploy a preview.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      url: ${{ steps.preview.outputs.url }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # `cf previews deploy` builds with `isPreview` set, so this job needs the
      # full toolchain even though the build job already validated the site.
      # A preview talks to the production D1 database and Queue, which is why
      # the configuration keeps the scheduled and queue triggers off previews.
      - run: pnpm install --frozen-lockfile

      - name: Publish preview
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          output="$(pnpm exec cf previews deploy \
            --preview-name "pr-$PR_NUMBER")"
          printf '%s\n' "$output"
          url="$(printf '%s' "$output" | jq -er '.preview_urls[0]')"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  preview-comment:
    needs: preview-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # This job never runs repository code, so it is the only one that gets
    # permission to write to the pull request.
    permissions:
      pull-requests: write
    steps:
      - name: Comment preview URL
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ needs.preview-deploy.outputs.url }}
        with:
          script: |
            const marker = "<!-- cloudflare-preview -->";
            const body = [
              marker,
              "### Cloudflare preview",
              "",
              `**${process.env.PREVIEW_URL}**`,
              "",
              `Commit \`${context.payload.pull_request.head.sha.slice(0, 7)}\` · updated on every push to this pull request.`,
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            );
            const existing = comments.find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  preview-cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request ref is deleted when an unmerged pull request
          # closes, so read the configuration from the base branch instead.
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Delete preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers/spotistats/previews/pr-$PR_NUMBER"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api")"

          case "$status" in
            200)
              pnpm exec cf previews delete \
                "pr-$PR_NUMBER" \
                --worker spotistats \
                --force
              ;;
            404)
              echo "No preview exists for PR #$PR_NUMBER."
              ;;
            *)
              echo "Unexpected Cloudflare API response for the preview: HTTP $status" >&2
              exit 1
              ;;
          esac
